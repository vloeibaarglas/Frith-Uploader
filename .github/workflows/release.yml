name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias frith \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass frith123 \
            -keypass frith123 \
            -dname "CN=Frith, OU=Upload, O=Frith, L=Unknown, ST=Unknown, C=US"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: frith123
          KEY_ALIAS: frith
          KEY_PASSWORD: frith123
        run: ./gradlew assembleRelease

      - name: Rename APK with version
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/frith-upload-${{ github.event.inputs.version }}.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frith-upload-${{ github.event.inputs.version }}
          path: app/build/outputs/apk/release/frith-upload-${{ github.event.inputs.version }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: |
            ## Frith Upload ${{ github.event.inputs.version }}

            ### Changes
            - See commit history for details

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on your device
            3. Open the APK to install
          files: app/build/outputs/apk/release/frith-upload-${{ github.event.inputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
